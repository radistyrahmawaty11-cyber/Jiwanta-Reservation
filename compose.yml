services:
  app:
    build: .
    container_name: jiwanta-reservation-app
    ports:
      - "1007:8000"
    volumes:
      - ".:/var/www/html"
    environment:
      - APP_ENV=local
      - APP_KEY=base64:GANTI_DENGAN_APP_KEY_KAMU
      - DB_CONNECTION=mysql
      - DB_HOST=mysql                 # <-- DIPERBAIKI: Harus nama service 'mysql'
      - DB_PORT=7001
      - DB_DATABASE=jiwanta_db
      - DB_USERNAME=root
      - DB_PASSWORD=jiwantaspring     # <-- DIPERBAIKI: Spasi dihapus, password disamakan
      - SESSION_DRIVER=file
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql_service
    environment:
      MYSQL_DATABASE: jiwanta_db
      MYSQL_ROOT_PASSWORD: jiwantaspring  # <-- DIPERBAIKI: Disamakan dengan DB_PASSWORD di atas
    ports:
      - "7001:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pjiwantaspring", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
