services:
  app:
    build: .
    container_name: jiwanta-reservation-app
    ports:
      - "1007:8000"
    volumes:
      - ".:/var/www/html"
    environment:
      - APP_ENV=local
      - APP_KEY=base64:GANTI_DENGAN_APP_KEY_KAMU
      - DB_CONNECTION=mysql
      - DB_HOST=mysql                 # <-- DIPERBAIKI: Harus nama service 'mysql'
      - DB_PORT=7001
      - DB_DATABASE=jiwanta_db
      - DB_USERNAME=demo_app_db
      - DB_PASSWORD=demopass123    # <-- DIPERBAIKI: Spasi dihapus, password disamakan
      - SESSION_DRIVER=file
    depends_on:
      mysql:
        condition: service_healthy

  